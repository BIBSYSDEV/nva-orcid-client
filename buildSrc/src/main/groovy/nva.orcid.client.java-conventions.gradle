plugins {
    id 'nva.java-conventions'
}

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    pmd {
        analyzeTests = false
        excludedRules = [
                'AvoidCatchingGenericException',
                'FieldNamingConventions',
                'GuardLogStatement',
                'VariableCanBeInlined'
        ]
    }
    spotless {
        enabled = false
    }
}
